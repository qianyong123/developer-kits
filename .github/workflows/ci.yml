name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e (Playwright Test)
        env:
          E2E_BROWSER: chromium
        run: npm run test:e2e

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Install CloudBase CLI
        run: npm i -g @cloudbase/cli

      - name: Login to CloudBase
        run: tcb login --apiKeyId "${{ secrets.TENCENT_SECRET_ID }}" --apiKey "${{ secrets.TENCENT_SECRET_KEY }}"

      - name: Deploy to CloudBase (versioned)
        run: tcb app deploy developer-kits --env-id kits-dev-d4g4yxxnw8e41a263 --deploy-path / --install-command "npm install" --build-command "npm run build" --output-dir dist --enable-git-ignore --force
